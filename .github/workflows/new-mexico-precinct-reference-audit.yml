name: Audit New Mexico historical precinct identifiers

on:
  pull_request:
    paths:
      - .github/workflows/new-mexico-precinct-reference-audit.yml
      - scripts/new_mexico_*turnout_history*.py
      - scripts/new_mexico_precinct_reference_audit.py
      - tests/test_new_mexico_precinct_reference_audit.py
  schedule:
    - cron: "37 13 * * 2"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: new-mexico-precinct-reference-audit-${{ github.ref }}
  cancel-in-progress: false

jobs:
  audit:
    if: github.repository == 'hanshanley/voter-participation'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          sparse-checkout: |
            scripts
            tests
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install audit and source reader dependencies
        run: python -m pip install 'pyshp==3.1.8' 'shapely==2.2.0' 'pytest>=8' 'requests>=2.31'
      - name: Test audit rules and retained turnout sources
        run: python -m pytest -q tests/test_new_mexico_precinct_reference_audit.py tests/test_new_mexico_turnout_history.py
      - name: Audit the exact accepted source and reproduce every output offline
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        shell: bash
        env:
          PROJ_NETWORK: "OFF"
        run: |
          source="$(git ls-remote --exit-code origin refs/tags/results-data | cut -f1)"
          [[ "$source" =~ ^[a-f0-9]{40}$ ]]
          audit="$RUNNER_TEMP/nm-precinct-audit"
          python -m scripts.new_mexico_precinct_reference_audit \
            --results-pointer "https://raw.githubusercontent.com/hanshanley/voter-participation/$source/latest.json" \
            --fetch-references --output "$audit"
          python -m scripts.new_mexico_precinct_reference_audit \
            --turnout-facts "$audit/inputs/turnout-facts.json" \
            --reference-rows "$audit/inputs/reference-rows.json" --output "$RUNNER_TEMP/nm-precinct-replay"
          diff -qr --exclude=accepted-checkpoint.json "$audit" "$RUNNER_TEMP/nm-precinct-replay"
          mkdir "$audit/scripts"
          cp scripts/new_mexico_precinct_reference_audit.py scripts/new_mexico_turnout_history{,_replay}.py "$audit/scripts/"
          jq -c '.[]' "$audit/summary.json" >> "$GITHUB_STEP_SUMMARY"
      - name: Retain every numerical row and replay input
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v6
        with:
          name: new-mexico-precinct-reference-audit
          retention-days: 30
          path: ${{ runner.temp }}/nm-precinct-audit/
          if-no-files-found: error
