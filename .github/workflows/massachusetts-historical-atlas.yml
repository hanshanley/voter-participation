name: Refresh Massachusetts historical atlas

on:
  schedule:
    - cron: "43 11 * * 2"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/massachusetts-historical-atlas.yml
      - scripts/massachusetts_historical_release.py
      - scripts/massachusetts_ballot_canvass.py
      - scripts/massachusetts_municipality_map.py
      - scripts/massachusetts_precinct_reference.py
      - data/results-intake/massachusetts-historical-reference/**

permissions:
  contents: write

concurrency:
  group: massachusetts-historical-atlas
  cancel-in-progress: false

jobs:
  refresh:
    if: github.repository == 'hanshanley/voter-participation' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          filter: blob:none
          sparse-checkout: |
            scripts
            data/results-intake/massachusetts-historical-reference
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install geometry replay and acceptance dependencies
        run: python -m pip install 'requests==2.34.2' 'pyshp==3.1.8' 'pyproj==3.8.0' 'shapely==2.2.0'
      - name: Refresh and publish the complete historical archive
        shell: bash
        env:
          PROJ_NETWORK: "OFF"
        run: |
          python -m scripts.massachusetts_historical_release --refresh --publish \
            --work "$RUNNER_TEMP/ma-atlas" | tee -a "$GITHUB_STEP_SUMMARY"
