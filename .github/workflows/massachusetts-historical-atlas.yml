name: Refresh Massachusetts historical atlas

on:
  schedule:
    - cron: "43 11 * * 2"
    - cron: "43 11 * * 3"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/massachusetts-historical-atlas.yml
      - scripts/massachusetts_historical_release.py
      - scripts/massachusetts_ballot_canvass.py
      - scripts/massachusetts_municipality_map.py
      - scripts/massachusetts_precinct_reference.py
      - data/results-intake/massachusetts-historical-reference/**

permissions:
  actions: read
  contents: write

concurrency:
  group: massachusetts-historical-atlas
  cancel-in-progress: false

jobs:
  refresh:
    if: github.repository == 'hanshanley/voter-participation' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check whether the primary weekly refresh already succeeded
        id: window
        env:
          GH_TOKEN: ${{ github.token }}
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          due=true
          if [[ "$SCHEDULE" == '43 11 * * 3' ]]; then
            since="$(date -u -d '36 hours ago' +%FT%TZ)"
            records="$(gh api --method GET \
              "repos/$GITHUB_REPOSITORY/actions/workflows/massachusetts-historical-atlas.yml/runs" \
              -f branch=main -f status=success -f created=">=$since" -F per_page=1)"
            if jq -e '.total_count > 0' <<<"$records" >/dev/null; then
              due=false
            fi
          fi
          echo "due=$due" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
        if: steps.window.outputs.due == 'true'
        with:
          filter: blob:none
          sparse-checkout: |
            scripts
            data/results-intake/massachusetts-historical-reference
      - uses: actions/setup-python@v6
        if: steps.window.outputs.due == 'true'
        with:
          python-version: "3.12"
      - name: Install geometry replay and collector dependencies
        if: steps.window.outputs.due == 'true'
        run: python -m pip install 'requests==2.34.2' 'pyshp==3.1.8' 'pyproj==3.8.0' 'shapely==2.2.0'
      - name: Refresh and publish the complete historical archive
        if: steps.window.outputs.due == 'true'
        shell: bash
        env:
          PROJ_NETWORK: "OFF"
        run: |
          python -m scripts.massachusetts_historical_release --refresh --publish \
            --work "$RUNNER_TEMP/ma-atlas" | tee -a "$GITHUB_STEP_SUMMARY"
