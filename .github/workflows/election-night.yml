name: Update election results
run-name: ${{ (github.event.schedule == '19 10 * * 1' || inputs.archive_only) && 'Check late participation archives' || ((github.event_name == 'schedule' || (inputs.reuse_collection_run == '' && inputs.refresh_sources == '' && !inputs.congressional_only)) && 'Collect full election results' || 'Run scoped election results update') }}

on:
  schedule:
    - cron: "23 * * * *"
    - cron: "19 10 * * 1"
  workflow_dispatch:
    inputs:
      archive_only:
        description: "Check only the reviewed late participation archives after the hourly window"
        required: false
        type: boolean
        default: false
      reuse_collection_run:
        description: "Optional completed collector run to publish without collecting sources again"
        required: false
        type: string
      refresh_sources:
        description: "Optional comma-separated registered sources; reuse all other accepted inputs"
        required: false
        type: string
      congressional_only:
        description: "Refresh both national congressional inventories; retain all participation sources"
        required: false
        type: boolean
        default: false

permissions:
  actions: read
  contents: write

concurrency:
  group: election-night-participation
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      active: ${{ steps.window.outputs.active }}
      late_archives: ${{ steps.window.outputs.late_archives }}
    steps:
      - name: Limit automatic collection to this election
        id: window
        env:
          EVENT_NAME: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
          ARCHIVE_ONLY: ${{ inputs.archive_only }}
          REUSE_COLLECTION_RUN: ${{ inputs.reuse_collection_run }}
          REFRESH_SOURCES: ${{ inputs.refresh_sources }}
          CONGRESSIONAL_ONLY: ${{ inputs.congressional_only }}
        run: |
          python - <<'PY'
          import os
          from datetime import datetime, timezone
          now = datetime.now(timezone.utc)
          start = datetime(2026, 11, 3, tzinfo=timezone.utc)
          cutoff = datetime(2027, 2, 1, tzinfo=timezone.utc)
          event = os.environ["EVENT_NAME"]
          schedule = os.environ["SCHEDULE"]
          manual_archive = event == "workflow_dispatch" and os.environ["ARCHIVE_ONLY"] == "true"
          if manual_archive and (
              now < cutoff or os.environ["GITHUB_REF"] != "refs/heads/main"
              or os.environ["REUSE_COLLECTION_RUN"] or os.environ["REFRESH_SOURCES"]
              or os.environ["CONGRESSIONAL_ONLY"] == "true"
          ):
              raise SystemExit("Archive recovery requires main, the late window, and no other collection mode")
          archive = manual_archive or (event == "schedule" and schedule == "19 10 * * 1" and now >= cutoff)
          full = event == "schedule" and schedule == "23 * * * *" and start <= now < cutoff
          active = event == "workflow_dispatch" or full or archive
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"active={str(active).lower()}\n")
              output.write(f"late_archives={str(archive).lower()}\n")
          PY

      - name: Checkout the intake tool and complete baseline only
        if: steps.window.outputs.active == 'true'
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          sparse-checkout: |
            .github
            scripts
            tests
            data/results-intake

      - name: Set up Python
        if: steps.window.outputs.active == 'true'
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install existing intake dependencies
        if: steps.window.outputs.active == 'true'
        run: python -m pip install 'requests>=2.31' 'pytest>=8' 'PyYAML>=6' 'openpyxl>=3.1' 'xlrd>=2' 'pypdf==6.16.0' 'PyMuPDF==1.26.5' 'pdfplumber==0.11.8' 'rapidocr-onnxruntime==1.4.4' 'pyshp>=2.3' 'pyproj>=3.6' 'shapely>=2.0'

      - name: Fingerprint the pinned validation environment
        id: validation_env
        if: steps.window.outputs.active == 'true' && github.ref == 'refs/heads/main'
        run: |
          python - <<'PY'
          import hashlib
          import os
          import platform
          import subprocess
          import sys

          image = [os.environ.get(name) for name in ("ImageOS", "ImageVersion")]
          if all(image):
              requirements = subprocess.check_output(
                  [sys.executable, "-m", "pip", "freeze", "--all"], text=True).splitlines()
              facts = [os.environ["GITHUB_SHA"], sys.version, platform.machine(),
                       *image, *sorted(requirements)]
              fingerprint = hashlib.sha256("\n".join(facts).encode()).hexdigest()
              with open(os.environ["GITHUB_OUTPUT"], "a") as output:
                  output.write(f"fingerprint={fingerprint}\n")
          PY

      - name: Restore only an exact successful validation receipt
        id: prior_validation
        if: steps.validation_env.outputs.fingerprint != ''
        uses: actions/cache/restore@v5
        continue-on-error: true
        with:
          path: ${{ runner.temp }}/election-validation-receipt
          key: election-validation-v1-${{ steps.validation_env.outputs.fingerprint }}

      - name: Check the prior validation receipt
        id: validation_receipt
        if: steps.prior_validation.outputs.cache-hit == 'true'
        env:
          EXPECTED: ${{ steps.validation_env.outputs.fingerprint }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path

          receipt = Path(os.environ["RUNNER_TEMP"]) / "election-validation-receipt"
          expected = os.environ["EXPECTED"].encode() + b"\n"
          try:
              with receipt.open("rb") as stream:
                  matched = stream.read(len(expected) + 1) == expected
          except OSError:
              matched = False
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"matched={str(matched).lower()}\n")
          PY

      - name: Test source identities, stops, complete queries and publication
        id: validation_tests
        if: steps.window.outputs.active == 'true' && steps.validation_receipt.outputs.matched != 'true'
        run: >
          python -m pytest -q tests/test_results_intake.py tests/test_results_granular.py tests/test_results_native.py tests/test_results_state_statistics.py tests/test_results_native_state_family.py tests/test_results_native_oregon.py tests/test_results_native_north_carolina.py tests/test_results_native_idaho.py tests/test_results_native_rhode_island.py tests/test_results_native_utah.py tests/test_results_native_virginia.py tests/test_results_native_virginia_repair.py tests/test_results_native_north_dakota.py tests/test_results_native_north_dakota_repair.py tests/test_results_intake_north_dakota_package.py tests/test_louisiana_onboarding.py tests/test_results_native_workbooks.py tests/test_results_pdf_tables.py tests/test_results_json_statistics.py tests/test_results_pdf_boston.py tests/test_results_pdf_periodic.py tests/test_results_pdf_affiliations.py tests/test_results_pdf_jefferson.py tests/test_results_pdf_cass.py tests/test_results_native_cass.py tests/test_results_pdf_dunn.py tests/test_automatic_runtime.py tests/test_automatic_native_refresh.py tests/test_nationwide.py tests/test_current.py tests/test_results_native_delaware.py tests/test_results_native_dc.py
          tests/test_current_source_reconciliation.py tests/test_automatic_estimates.py
          tests/test_results_native_broome.py
          tests/test_results_native_kansas.py
          tests/test_results_pdf_cole.py
          tests/test_results_pdf_platte.py
          tests/test_supported_analytical_release.py
          tests/test_results_congress.py
          tests/test_congressional_analytical_bridge.py tests/test_congressional_baselines.py
          tests/test_congressional_candidate_identity.py
          tests/test_congressional_category_reconciliation.py
          tests/test_congressional_geography.py
          tests/test_congressional_split_blocks.py
          tests/test_senate_legacy_bridge.py
          tests/test_senate_complete_categories.py
          tests/test_results_uf_turnout.py
          tests/test_results_official_congress.py
          tests/test_results_aspx_congress.py
          tests/test_results_native_congress.py
          tests/test_results_json_congress.py
          tests/test_results_clarity_congress.py
          tests/test_results_county_frame.py
          tests/test_congressional_complete_categories.py
          tests/test_official_house_precedence.py
          tests/test_native_official_house.py
          tests/test_congressional_reference_identity.py
          tests/test_protected_official_house.py
          tests/test_protected_official_wyoming.py
          tests/test_statewide_ballot_totals.py
          tests/test_ohio_retained_turnout.py
          tests/test_retained_turnout.py
          tests/test_eac_county_turnout.py
          tests/test_historical_native_counts.py tests/test_historical_precinct_qualification.py tests/test_historical_precinct_integration.py tests/test_historical_precinct_coverage.py
          tests/test_election_night_workflow.py tests/test_automatic_health.py

      - name: Record a passing validation for the exact environment
        if: steps.validation_tests.outcome == 'success' && steps.validation_env.outputs.fingerprint != ''
        env:
          FINGERPRINT: ${{ steps.validation_env.outputs.fingerprint }}
        run: printf '%s\n' "$FINGERPRINT" > "$RUNNER_TEMP/election-validation-receipt"

      - name: Save the passing validation receipt
        if: steps.validation_tests.outcome == 'success' && steps.validation_env.outputs.fingerprint != '' && steps.prior_validation.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        continue-on-error: true
        with:
          path: ${{ runner.temp }}/election-validation-receipt
          key: election-validation-v1-${{ steps.validation_env.outputs.fingerprint }}

  refresh:
    needs: validate
    if: needs.validate.outputs.active == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout the tested intake tool and complete baseline only
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          sparse-checkout: |
            scripts
            tests
            data/results-intake

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install existing intake dependencies
        run: python -m pip install 'requests>=2.31' 'pytest>=8' 'openpyxl>=3.1' 'xlrd>=2' 'pypdf==6.16.0' 'PyMuPDF==1.26.5' 'pdfplumber==0.11.8' 'rapidocr-onnxruntime==1.4.4'

      - name: Reuse conditional HTTP cache
        uses: actions/cache@v5
        with:
          path: ${{ runner.temp }}/election-intake/cache
          key: election-intake-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: election-intake-

      - name: Activate any previously staged verified collection before acquiring again
        id: resume
        env:
          LATE_ARCHIVES: ${{ needs.validate.outputs.late_archives }}
        run: |
          mkdir -p "$RUNNER_TEMP/election-intake"
          python -m scripts.results_intake resume-publication > "$RUNNER_TEMP/election-intake/resume.json"
          status="$(python -c 'import json, sys; print(json.load(open(sys.argv[1]))["status"])' "$RUNNER_TEMP/election-intake/resume.json")"
          echo "status=$status" >> "$GITHUB_OUTPUT"
          if [ "$status" = "published" ] && [ "$LATE_ARCHIVES" != "true" ]; then
            cp "$RUNNER_TEMP/election-intake/resume.json" "$RUNNER_TEMP/election-intake/publication.json"
          fi

      - name: Find a durable checkpoint from the same collection lane
        if: steps.resume.outputs.status == 'no_pending_publication' && (github.event_name == 'schedule' || (inputs.reuse_collection_run == '' && inputs.refresh_sources == '' && !inputs.congressional_only))
        id: checkpoint
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          LATE_ARCHIVES: ${{ needs.validate.outputs.late_archives }}
        run: |
          python - <<'PY'
          import json, os, subprocess
          from datetime import datetime, timedelta, timezone
          from urllib.parse import urlencode

          base = f"repos/{os.environ['GH_REPO']}/actions"
          def get(path):
              return json.loads(subprocess.check_output(["gh", "api", base + path]))

          late = os.environ["LATE_ARCHIVES"] == "true"
          late_title = "Check late participation archives"
          params = {"branch": "main", "status": "completed", "per_page": 100 if late else 20}
          if late:
              # After the cutoff, skipped hourly runs still fill the intervening history.
              since = datetime.now(timezone.utc) - timedelta(days=14)
              params["created"] = since.strftime(">=%Y-%m-%dT%H:%M:%SZ")
          run = None
          for page in range(1, 5 if late else 2):
              params["page"] = page
              runs = get("/workflows/election-night.yml/runs?" + urlencode(params))["workflow_runs"]
              if late:
                  run = next((run for run in runs if run["event"] in ("schedule", "workflow_dispatch")
                              and run["display_title"] == late_title), None)
              else:
                  run = next((run for run in runs
                              if (run["event"] == "schedule" and run["display_title"] != late_title)
                              or (run["event"] == "workflow_dispatch"
                                  and run["display_title"] == "Collect full election results")), None)
              if run or len(runs) < params["per_page"]:
                  break
          if run and run["conclusion"] in ("cancelled", "timed_out", "failure"):
              steps = {step["name"]: step["conclusion"] for job in get(f"/runs/{run['id']}/jobs")["jobs"]
                       for step in job["steps"]}
              if (steps.get("Checkpoint the completed collection before publication") == "success"
                      and steps.get("Publish valid results or preserve new access stops") in (None, "skipped", "cancelled")):
                  with open(os.environ["GITHUB_OUTPUT"], "a") as out:
                      out.write(f"run={run['id']}\n")
          PY

      - name: Recover an already completed collection without source requests
        if: steps.resume.outputs.status == 'no_pending_publication' && (inputs.reuse_collection_run != '' || steps.checkpoint.outputs.run != '')
        id: restore
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          COLLECTION_RUN: ${{ inputs.reuse_collection_run || steps.checkpoint.outputs.run }}
          AUTO_RECOVERY: ${{ steps.checkpoint.outputs.run != '' }}
          LATE_ARCHIVES: ${{ needs.validate.outputs.late_archives }}
        run: |
          python - <<'PY'
          import json, os, re, subprocess
          from pathlib import Path
          run = os.environ["COLLECTION_RUN"]
          if not re.fullmatch(r"[1-9][0-9]*", run):
              raise ValueError("A completed collector run ID is required")
          metadata = json.loads(subprocess.check_output(["gh", "api", f"repos/{os.environ['GH_REPO']}/actions/runs/{run}"]))
          if metadata["path"] != ".github/workflows/election-night.yml" or metadata["status"] != "completed":
              raise ValueError("Recovery requires a completed run of this collector")
          jobs = json.loads(subprocess.check_output(["gh", "api", f"repos/{os.environ['GH_REPO']}/actions/runs/{run}/jobs"]))
          if not any(step["name"] == "Collect independent House and participation results" and step["conclusion"] == "success"
                     for job in jobs["jobs"] for step in job["steps"]):
              raise ValueError("The original source collection did not succeed")
          directory = Path(os.environ["RUNNER_TEMP"]) / "completed-election-collection"
          checkpointed = any(step["name"] == "Checkpoint the completed collection before publication"
                             for job in jobs["jobs"] for step in job["steps"])
          attempt = metadata["run_attempt"]
          name = f"election-results-{run}"
          if checkpointed and attempt > 1:
              name += f"-attempt-{attempt}"
          subprocess.run(["gh", "run", "download", run, "--name", name,
                          "--dir", str(directory)], check=True)
          work = Path(os.environ["RUNNER_TEMP"]) / "election-intake"
          work.mkdir(exist_ok=True)
          args = ["python", "-m", "scripts.results_intake", "restore",
                  "--package", str(directory / "complete-results.zip"),
                  "--report", str(directory / "report.json"), "--work-dir", str(work)]
          if os.environ["AUTO_RECOVERY"] == "true":
              args += ["--require-predecessor", str(directory / "publication-parent.json")]
              if os.environ["LATE_ARCHIVES"] == "true":
                  args += ["--require-late-archive-scope"]
          with (work / "recovery.json").open("w") as out:
              subprocess.run(args, stdout=out, check=True)
          recovery = json.loads((work / "recovery.json").read_bytes())
          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              out.write(f"status={recovery.get('status', 'restored')}\n")
          PY

      - name: Collect independent House and participation results
        # A resumed packet does not fulfill the weekly check. The scoped CLI reloads
        # the active collector state before collecting the archives.
        if: (steps.resume.outputs.status == 'no_pending_publication' || (needs.validate.outputs.late_archives == 'true' && steps.resume.outputs.status == 'published')) && inputs.reuse_collection_run == '' && (steps.checkpoint.outputs.run == '' || steps.restore.outputs.status == 'superseded')
        id: capture
        continue-on-error: true
        env:
          LATE_ARCHIVES: ${{ needs.validate.outputs.late_archives }}
          REFRESH_SOURCES: ${{ inputs.refresh_sources }}
          CONGRESSIONAL_ONLY: ${{ inputs.congressional_only }}
        run: |
          if [ "$LATE_ARCHIVES" = "true" ]; then
            python -m scripts.results_intake refresh-selected --late-archives \
              --registry data/results-intake/registry.json \
              --work-dir "$RUNNER_TEMP/election-intake"
          elif [ "$CONGRESSIONAL_ONLY" = "true" ]; then
            python -m scripts.results_intake refresh-congress \
              --registry data/results-intake/registry.json \
              --work-dir "$RUNNER_TEMP/election-intake"
          elif [ -n "$REFRESH_SOURCES" ]; then
            python -m scripts.results_intake refresh-selected \
              --sources "$REFRESH_SOURCES" \
              --registry data/results-intake/registry.json \
              --work-dir "$RUNNER_TEMP/election-intake"
          else
            python -m scripts.results_intake collect \
              --registry data/results-intake/registry.json \
              --work-dir "$RUNNER_TEMP/election-intake"
          fi

      - name: Checkpoint the completed collection before publication
        if: steps.capture.outcome == 'success'
        id: saved
        uses: actions/upload-artifact@v6
        with:
          name: ${{ github.run_attempt == 1 && format('election-results-{0}', github.run_id) || format('election-results-{0}-attempt-{1}', github.run_id, github.run_attempt) }}
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
          path: |
            ${{ runner.temp }}/election-intake/report.json
            ${{ runner.temp }}/election-intake/publication-parent.json
            ${{ runner.temp }}/election-intake/source-stops.json
            ${{ runner.temp }}/election-intake/complete-results.zip

      - name: Publish valid results or preserve new access stops
        id: publication
        if: always() && (steps.saved.outcome == 'success' || steps.capture.outcome == 'failure' || steps.restore.outputs.status == 'restored')
        run: |
          python -m scripts.results_intake publish \
            --work-dir "$RUNNER_TEMP/election-intake" \
            > "$RUNNER_TEMP/election-intake/publication.json"

      - name: Write current-results summary
        if: always()
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          report = Path(os.environ["RUNNER_TEMP"]) / "election-intake/report.json"
          publication = report.with_name("publication.json")
          body = publication.read_bytes().strip() if publication.exists() else b""
          status = json.loads(body)["status"] if body else "not completed"
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as out:
              if report.exists():
                  data = json.loads(report.read_bytes())
                  out.write("# Current election results\n\n")
                  out.write(f"Jurisdictions: {data['jurisdictions']}. ")
                  out.write(f"House districts with available returns: {data['house_districts_available']}")
                  out.write(f"/{data['house_districts_declared']}.\n\n")
                  for chamber, counts in data.get("congressional", {}).items():
                      out.write(f"National {chamber}: {counts['discovered']} discovered; ")
                      out.write(f"{counts['refreshed']} source-verified; {counts['retained']} retained; ")
                      out.write(f"{counts['held']} held; {counts['unknown_count_races']} unknown-count races. ")
                      out.write(f"Nonvoting House seats: {counts['nonvoting_house_seats']}.\n\n")
                  uf = data.get("uf_turnout")
                  if uf:
                      out.write(f"UF statewide turnout: **{uf['status']}**, version {uf['version']}; ")
                      out.write(f"{uf['jurisdiction_rows']} jurisdictions plus {uf['separate_us_rows']} US row. ")
                      out.write(f"Native status classifications: {uf['ballot_status']}. ")
                      out.write("Not independently certified or allocated to localities/groups.\n\n")
                  out.write(f"Data publication: **{status}**. ")
                  out.write("On successful publication, `results-data/latest.json` pins the ")
                  out.write("immutable complete queries and reproducible ZIP.\n\n")
                  out.write("Counting completeness is not certification. Candidate votes are not ballots. ")
                  out.write("New source layouts remain explicit review items; failed sources retain prior data.\n")
              elif status == "published":
                  out.write("Activated a previously staged complete source packet without reacquiring sources.\n")
              else:
                  out.write("Intake failed. Last valid results remain active; inspect the retained report.\n")
          PY

      - name: Retain publication and recovery receipts
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: election-publication-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: warn
          retention-days: 30
          path: |
            ${{ runner.temp }}/election-intake/report.json
            ${{ runner.temp }}/election-intake/source-stops.json
            ${{ runner.temp }}/election-intake/publication.json
            ${{ runner.temp }}/election-intake/recovery.json
            ${{ runner.temp }}/election-intake/resume.json

      - name: Fail visibly if collection did not finish
        if: always() && (steps.capture.outcome == 'failure' || steps.restore.outcome == 'failure' || (needs.validate.outputs.late_archives == 'true' && steps.capture.outcome != 'success' && steps.restore.outputs.status != 'restored'))
        run: exit 1
