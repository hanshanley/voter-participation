name: Recover already collected summary originals

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: summary-cache-diagnostic
  cancel-in-progress: false

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: 6b624362bc4d4a8b2fbad3b2a94a05bfe06a06ae
          sparse-checkout: |
            scripts
            data/results-intake
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install 'requests>=2.31' 'pypdf>=4'
      - uses: actions/cache/restore@v5
        with:
          path: ${{ runner.temp }}/election-intake/cache
          key: election-intake-43644313766-1
          fail-on-cache-miss: true
      - name: Inspect exact already-collected bodies without source requests
        run: |
          python - <<'PY'
          import io, json, os
          from pathlib import Path
          import socket
          from pypdf import PdfReader
          from scripts.results_intake import baseline_inputs
          from scripts.results_native import source_plan, summary_statistics, SUMMARY_PROFILES
          from scripts.participation_intake.contract import encoded, pin
          def deny(*args, **kwargs):
              raise AssertionError("Diagnostic must not acquire sources")
          socket.socket = socket.create_connection = socket.getaddrinfo = deny
          registry = Path("data/results-intake/registry.json")
          config = json.loads(registry.read_bytes())
          baseline = baseline_inputs(registry.parent / config["baseline"]["root"], config["baseline"])
          selected = {
              "cch": ("7102a5a55fe0b12b25c5b3569603b2c3825b0a6876874ef5ccab216ef5135296", 23908),
              "coh": ("29743dbcba7a18bf3cf5ba0229a3b097316f4f7cc9dd735a50aa3c930277c0a6", 9441),
              "cok": ("dd8e88d93fb7da8c4e78fea291270071d5e3e2c33d38f8a2f2d32badc2c113e7", 8592),
              "com": ("0bb3d2fc122afbe65ffc71289acc53e0ef1a802ab7448a80501c1e1e60220d55", 15082),
          }
          cache = Path(os.environ["RUNNER_TEMP"]) / "election-intake/cache/objects"
          output = Path(os.environ["RUNNER_TEMP"]) / "summary-cached-originals"
          output.mkdir()
          report = {}
          for identity, source in source_plan(baseline)["HI"].items():
              if source["adapter"] != "reviewed_summary_statistics":
                  continue
              url = source["url"]
              name = url.rsplit("/", 1)[1].removesuffix(".pdf")
              sha, size = selected[name]
              body = (cache / sha).read_bytes()
              assert pin(body) == {"bytes": size, "sha256": sha}
              (output / (name + ".pdf")).write_bytes(body)
              pages = [page.extract_text(extraction_mode="layout") for page in PdfReader(io.BytesIO(body)).pages]
              (output / (name + ".txt")).write_text("\f".join(pages))
              try:
                  result = summary_statistics(body, source["templates"], SUMMARY_PROFILES[url])
                  report[name] = {"passed": True, "updates": len(result["updates"])}
              except Exception as error:
                  report[name] = {"passed": False, "error_type": type(error).__name__, "error": str(error)}
              report[name].update(source=pin(body), source_url=url)
          assert set(report) == set(selected)
          (output / "diagnostic.json").write_bytes(encoded(
              {"source_requests": 0, "exact_cache_key": "election-intake-43644313766-1", "reports": report}))
          print(json.dumps(report))
          PY
      - uses: actions/upload-artifact@v6
        with:
          name: summary-cached-originals
          retention-days: 7
          path: ${{ runner.temp }}/summary-cached-originals
