name: Inspect already collected native webform originals

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: htmlstats-cache-diagnostic
  cancel-in-progress: false

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/cache/restore@v5
        with:
          path: ${{ runner.temp }}/election-intake/cache
          key: election-intake-43650846819-1
          fail-on-cache-miss: true
      - name: Export only hash-bound originals without source requests
        run: |
          python - <<'PY'
          import hashlib, json, os, socket
          from pathlib import Path
          def deny(*args, **kwargs):
              raise AssertionError("Cache inspection must not acquire sources")
          socket.socket = socket.create_connection = socket.getaddrinfo = deny
          selected = json.loads('{"NV-registered-2e44161be129c336": {"bytes": 478222, "sha256": "8a0b47b0d19409ebd64fe25bb52d7afed5cb44b36a4038cdd0783a8a5ae378dc", "url": "https://elections.clarkcountynv.gov/ElectionResults_NV/EnrEng/EnrMain"}, "WI-registered-e5b8a4b930d79d05": {"bytes": 134561, "sha256": "5446fcc254a6a280214022e247754aa59ab5123ca855a8aa8cf93f0085babfe7", "url": "https://apps.jeffersoncountywi.gov/jc/election/results/11032026"}, "WV-registered-99d1e3c526b6dcc7": {"bytes": 172683, "sha256": "a39a691de544fb7340e76e7e743dc312e09b620cb2c6d0372386d2414913231c", "url": "https://www.monongaliacountyclerk.com/myfiles/elections/2026General/Unofficial26G.html"}}')
          cache = Path(os.environ["RUNNER_TEMP"]) / "election-intake/cache/objects"
          output = Path(os.environ["RUNNER_TEMP"]) / "htmlstats-cached-originals"
          output.mkdir()
          for identity, source in selected.items():
              body = (cache / source["sha256"]).read_bytes()
              assert len(body) == source["bytes"]
              assert hashlib.sha256(body).hexdigest() == source["sha256"]
              (output / (identity + ".html")).write_bytes(body)
          (output / "diagnostic.json").write_text(json.dumps({
              "source_requests": 0, "cache_key": "election-intake-43650846819-1",
              "originals": selected}, sort_keys=True) + "\n")
          print(json.dumps({"originals": len(selected), "source_requests": 0}))
          PY
      - uses: actions/upload-artifact@v6
        with:
          name: htmlstats-cached-originals
          retention-days: 7
          path: ${{ runner.temp }}/htmlstats-cached-originals
