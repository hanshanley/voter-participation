name: Update election results

on:
  schedule:
    - cron: "23 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: election-night-participation
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Limit automatic collection to this election
        id: window
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          python - <<'PY'
          import os
          from datetime import datetime, timezone
          now = datetime.now(timezone.utc)
          active = os.environ["EVENT_NAME"] == "workflow_dispatch" or (
              datetime(2026, 11, 3, tzinfo=timezone.utc) <= now <
              datetime(2027, 2, 1, tzinfo=timezone.utc)
          )
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"active={str(active).lower()}\n")
          PY

      - name: Checkout the intake tool and complete baseline only
        if: steps.window.outputs.active == 'true'
        uses: actions/checkout@v7
        with:
          ref: main
          sparse-checkout: |
            scripts
            tests
            data/results-intake

      - name: Set up Python
        if: steps.window.outputs.active == 'true'
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install existing intake dependencies
        if: steps.window.outputs.active == 'true'
        run: python -m pip install 'requests>=2.31' 'pytest>=8' 'xlrd>=2' 'pypdf>=4' 'PyMuPDF>=1.23' 'rapidocr-onnxruntime==1.4.4'

      - name: Test source identities, stops, complete queries and publication
        if: steps.window.outputs.active == 'true'
        run: python -m pytest -q tests/test_results_intake.py tests/test_results_granular.py tests/test_results_native.py tests/test_nationwide.py tests/test_current.py

      - name: Reuse conditional HTTP cache
        if: steps.window.outputs.active == 'true'
        uses: actions/cache@v5
        with:
          path: ${{ runner.temp }}/election-intake/cache
          key: election-intake-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: election-intake-

      - name: Collect independent House and participation results
        if: steps.window.outputs.active == 'true'
        id: capture
        continue-on-error: true
        run: |
          python -m scripts.results_intake collect \
            --registry data/results-intake/registry.json \
            --work-dir "$RUNNER_TEMP/election-intake"

      - name: Publish valid results or preserve new access stops
        id: publication
        if: always() && steps.window.outputs.active == 'true' && (steps.capture.outcome == 'success' || steps.capture.outcome == 'failure')
        run: |
          python -m scripts.results_intake publish \
            --work-dir "$RUNNER_TEMP/election-intake" \
            > "$RUNNER_TEMP/election-intake/publication.json"

      - name: Write current-results summary
        if: always() && steps.window.outputs.active == 'true'
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          report = Path(os.environ["RUNNER_TEMP"]) / "election-intake/report.json"
          publication = report.with_name("publication.json")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as out:
              if report.exists():
                  data = json.loads(report.read_bytes())
                  out.write("# Current election results\n\n")
                  out.write(f"Jurisdictions: {data['jurisdictions']}. ")
                  out.write(f"House districts with available returns: {data['house_districts_available']}")
                  out.write(f"/{data['house_districts_declared']}.\n\n")
                  body = publication.read_bytes() if publication.exists() else b""
                  status = json.loads(body)["status"] if body else "not completed"
                  out.write(f"Data publication: **{status}**. ")
                  out.write("On successful publication, `results-data/latest.json` pins the ")
                  out.write("immutable complete queries and reproducible ZIP.\n\n")
                  out.write("Counting completeness is not certification. Candidate votes are not ballots. ")
                  out.write("New source layouts remain explicit review items; failed sources retain prior data.\n")
              else:
                  out.write("Intake failed. Last valid results remain active; inspect the retained report.\n")
          PY

      - name: Retain the report and complete numerical package
        if: always() && steps.window.outputs.active == 'true'
        uses: actions/upload-artifact@v6
        with:
          name: election-results-${{ github.run_id }}
          if-no-files-found: warn
          retention-days: 30
          path: |
            ${{ runner.temp }}/election-intake/report.json
            ${{ runner.temp }}/election-intake/source-stops.json
            ${{ runner.temp }}/election-intake/publication.json
            ${{ runner.temp }}/election-intake/complete-results.zip

      - name: Fail visibly if collection did not finish
        if: always() && steps.window.outputs.active == 'true' && steps.capture.outcome == 'failure'
        run: exit 1
