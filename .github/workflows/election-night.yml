name: Diagnose cached Jefferson extraction
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: jefferson-extraction-diagnostic
  cancel-in-progress: false
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: scripts
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Match the failed hosted parser versions
        run: python -m pip install 'requests==2.34.2' 'pypdf==7.1.0'
      - uses: actions/cache/restore@v5
        with:
          path: ${{ runner.temp }}/election-intake/cache
          key: election-intake-43669246178-1
          fail-on-cache-miss: true
      - name: Inspect the exact captured PDF with source networking blocked
        run: |
          python - <<'PY'
          import hashlib, json, os, platform, socket, traceback
          from pathlib import Path
          import pypdf
          from scripts import results_pdf_jefferson as jefferson
          def deny(*args, **kwargs):
              raise AssertionError("This diagnosis must not acquire sources")
          socket.socket = socket.create_connection = socket.getaddrinfo = deny
          expected = jefferson.QUALIFICATION_SOURCE
          body = (Path(os.environ["RUNNER_TEMP"]) /
                  "election-intake/cache/objects" / expected["sha256"]).read_bytes()
          assert len(body) == expected["bytes"]
          assert hashlib.sha256(body).hexdigest() == expected["sha256"]
          output = Path(os.environ["RUNNER_TEMP"]) / "jefferson-host-diagnostic"
          output.mkdir()
          result = {"source_requests": 0, "source": expected,
                    "python": platform.python_version(), "pypdf": pypdf.__version__}
          try:
              query = jefferson.factual_query(body)
              result.update(extraction_passed=True, units=query["native_unit_count"])
          except Exception as error:
              result.update(extraction_passed=False, error_type=type(error).__name__,
                            error=str(error), traceback=traceback.format_exc())
          (output / "diagnostic.json").write_text(json.dumps(result, indent=2) + "\n")
          print(json.dumps(result))
          PY
      - uses: actions/upload-artifact@v6
        with:
          name: jefferson-host-diagnostic
          retention-days: 7
          path: ${{ runner.temp }}/jefferson-host-diagnostic
