name: Preserve election-night participation

on:
  schedule:
    - cron: "7,22,37,52 * 4-5 11 *"
    - cron: "37 * 6-19 11 *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: election-night-participation
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Limit automatic collection to this election
        id: window
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          python - <<'PY'
          import os
          from datetime import datetime, timezone
          now = datetime.now(timezone.utc)
          active = os.environ["EVENT_NAME"] == "workflow_dispatch" or (
              datetime(2026, 11, 4, tzinfo=timezone.utc) <= now <
              datetime(2026, 11, 20, tzinfo=timezone.utc)
          )
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"active={str(active).lower()}\n")
          PY

      - name: Checkout saved data
        if: steps.window.outputs.active == 'true'
        uses: actions/checkout@v7
        with:
          ref: main

      - name: Set up Python
        if: steps.window.outputs.active == 'true'
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install current-snapshot dependencies
        if: steps.window.outputs.active == 'true'
        run: python -m pip install 'requests>=2.31' 'pytest>=8'

      - name: Capture detailed North Carolina observations
        if: steps.window.outputs.active == 'true'
        id: capture
        continue-on-error: true
        run: python -m scripts.current

      - name: Capture nationwide participation independently
        if: steps.window.outputs.active == 'true'
        id: nationwide
        continue-on-error: true
        run: python -m scripts.nationwide

      - name: Validate the saved snapshot and complete downloads
        if: steps.capture.outcome == 'success' || steps.nationwide.outcome == 'success'
        id: validate
        continue-on-error: true
        run: |
          python -m pytest -q tests/test_current.py tests/test_nationwide.py tests/test_model.py
          python -c "from scripts.current import update_downloads; update_downloads()"

      - name: Preserve source captures and validated publication data
        if: always() && steps.window.outputs.active == 'true' && steps.nationwide.outcome != 'skipped'
        env:
          VALIDATED: ${{ steps.validate.outcome == 'success' }}
          NC_CAPTURED: ${{ steps.capture.outcome == 'success' }}
          NATIONAL_CAPTURED: ${{ steps.nationwide.outcome == 'success' }}
        run: |
          git config user.name hanshanley
          git config user.email hwahhanley@gmail.com
          git add data/raw/current data/raw/nationwide
          if [ "$VALIDATED" = "true" ]; then
            if [ "$NC_CAPTURED" = "true" ]; then git add public/data/current; fi
            if [ "$NATIONAL_CAPTURED" = "true" ]; then git add public/data/nationwide; fi
            git add public/data/analysis.json public/data/complete-analysis.zip
          fi
          if ! git diff --cached --quiet; then
            git commit -m "Preserve 2026 nationwide participation snapshot $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            git push origin HEAD:main
          fi
          if [ "$VALIDATED" != "true" ] || [ "$NC_CAPTURED" != "true" ] || [ "$NATIONAL_CAPTURED" != "true" ]; then
            echo "::error::A collector or validation failed. Validated independent updates and raw failure evidence were preserved."
            exit 1
          fi
