name: Inspect already collected statistical JSON and PDF originals

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: statistical-cache-diagnostic
  cancel-in-progress: false

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/cache/restore@v5
        with:
          path: ${{ runner.temp }}/election-intake/cache
          key: election-intake-43659940796-1
          fail-on-cache-miss: true
      - name: Export only hash-bound originals without source requests
        run: |
          python - <<'PY'
          import hashlib, json, os, socket
          from pathlib import Path
          def deny(*args, **kwargs):
              raise AssertionError("Cache inspection must not acquire sources")
          socket.socket = socket.create_connection = socket.getaddrinfo = deny
          selected = json.loads('{"IN-registered-3a1dcc11780a709c": {"bytes": 18567, "sha256": "2f3a76310515732bfbde8439f59c99605a0560c57798b30ac2ea7eb507ffd83d", "url": "https://services1.arcgis.com/nYfGJ9xFTKW6VPqW/arcgis/rest/services/Join_Features_to_MonroeCountyGeneralElection2026_Precincts_inner_view/FeatureServer/0/query?where=1%3D1&outFields=Precinct_ID%2CPrecinct%2CRegistered_Voters%2CBallots_Cast%2CTurnout_Percentage%2CPrecinct_Reporting&returnDistinctValues=true&returnGeometry=false&orderByFields=Precinct_ID&f=json"}, "IN-registered-d14c28ec8eaa3a08": {"bytes": 3508, "sha256": "6135a694aa1240a50ec8e8232863dd3a4cf0ba2503711680d02f1ec34d454a3a", "url": "https://app.enhancedvoting.com/results/public/api/elections/porter-county-in/GeneralNov032026"}, "MA-registered-30c48e5b9e1fdf82": {"bytes": 2761513, "sha256": "df0501d565dafedd17448bc0e4380a320548efc8c25e3150860cb5d265fad4b9", "url": "https://www.boston.gov/sites/default/files/file/2026/11/2026-Unofficial-Statement-Of-Votes-Cast.pdf"}, "NJ-registered-4d22d93a49012b01": {"bytes": 89198, "sha256": "fc82617a71b7e45bda37943ca71a277e38d039a4b4ca914a131c57fed3b16165", "url": "https://nj.gov/state/elections/assets/pdf/periodic-report/2026/2026-1112-middlesex-periodic-report.pdf"}, "NJ-registered-803aa631de326407": {"bytes": 264515, "sha256": "42efb9391440983ff22adcdbc24dbfd2134d794515ddc45dec60a9c5cf95c978", "url": "https://nj.gov/state/elections/assets/pdf/periodic-report/2026/2026-1112-cumberland-periodic-report.pdf"}}')
          cache = Path(os.environ["RUNNER_TEMP"]) / "election-intake/cache/objects"
          output = Path(os.environ["RUNNER_TEMP"]) / "statistical-cached-originals"
          output.mkdir()
          for identity, source in selected.items():
              body = (cache / source["sha256"]).read_bytes()
              assert len(body) == source["bytes"]
              assert hashlib.sha256(body).hexdigest() == source["sha256"]
              (output / (identity + ".bin")).write_bytes(body)
          (output / "diagnostic.json").write_text(json.dumps({
              "source_requests": 0, "cache_key": "election-intake-43659940796-1",
              "originals": selected}, sort_keys=True) + "\n")
          print(json.dumps({"originals": len(selected), "source_requests": 0}))
          PY
      - uses: actions/upload-artifact@v6
        with:
          name: statistical-cached-originals
          retention-days: 7
          path: ${{ runner.temp }}/statistical-cached-originals
