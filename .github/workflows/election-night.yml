name: Inspect already collected native webform originals

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: webforms-cache-diagnostic
  cancel-in-progress: false

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/cache/restore@v5
        with:
          path: ${{ runner.temp }}/election-intake/cache
          key: election-intake-43644313766-1
          fail-on-cache-miss: true
      - name: Export only hash-bound originals without source requests
        run: |
          python - <<'PY'
          import hashlib, json, os, socket
          from pathlib import Path
          def deny(*args, **kwargs):
              raise AssertionError("Cache inspection must not acquire sources")
          socket.socket = socket.create_connection = socket.getaddrinfo = deny
          selected = json.loads('{"NE-registered-206273de142fbc0e": {"bytes": 1255899, "sha256": "3e82646a08f84292f8fb572f2a4b91ef2ad066c8e23738e742c12df17d181821", "url": "https://electionresults.nebraska.gov/VoterTurnoutDetails.aspx?map=TURN"}, "NE-registered-2e5fb32bc6276f9a": {"bytes": 1255899, "sha256": "18aa00c0d4b479584ed75f8a14796bba8499903ab143db79875415595d13cc5f", "url": "https://electionresults.nebraska.gov/VoterTurnoutDetails.aspx?map=PREC"}, "SD-registered-196885c914baee2a": {"bytes": 742325, "sha256": "b50cab9667dfa894d211f3f2e0f09a6862ad6583b8494055d6545438a2ac9b8d", "url": "https://electionresults.sd.gov/VoterTurnoutDetails.aspx?map=PREC"}}')
          cache = Path(os.environ["RUNNER_TEMP"]) / "election-intake/cache/objects"
          output = Path(os.environ["RUNNER_TEMP"]) / "webforms-cached-originals"
          output.mkdir()
          for identity, source in selected.items():
              body = (cache / source["sha256"]).read_bytes()
              assert len(body) == source["bytes"]
              assert hashlib.sha256(body).hexdigest() == source["sha256"]
              (output / (identity + ".html")).write_bytes(body)
          (output / "diagnostic.json").write_text(json.dumps({
              "source_requests": 0, "cache_key": "election-intake-43644313766-1",
              "originals": selected}, sort_keys=True) + "\n")
          print(json.dumps({"originals": len(selected), "source_requests": 0}))
          PY
      - uses: actions/upload-artifact@v6
        with:
          name: webforms-cached-originals
          retention-days: 7
          path: ${{ runner.temp }}/webforms-cached-originals
