[project]
name = "voter-participation"
version = "0.1.0"
description = "Historical turnout, denominators, and precinct coverage"
requires-python = ">=3.9"
dependencies = ["requests>=2.31", "openpyxl>=3.1", "xlrd>=2", "pyshp>=2.3", "pyproj>=3.6", "shapely>=2.0"]

[project.optional-dependencies]
pdf = ["PyMuPDF>=1.23", "pdfplumber>=0.10"]
simulation = ["numpy>=1.26"]
test = ["pytest>=8", "playwright>=1.40", "numpy>=1.26", "PyMuPDF>=1.23", "pdfplumber>=0.10"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
