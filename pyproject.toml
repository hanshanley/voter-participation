[project]
name = "voter-participation"
version = "0.1.0"
description = "Historical turnout, denominators, and precinct coverage"
requires-python = ">=3.9"
dependencies = ["requests>=2.31", "openpyxl>=3.1", "pyshp>=2.3", "pyproj>=3.6"]

[project.optional-dependencies]
test = ["pytest>=8", "playwright>=1.40"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
